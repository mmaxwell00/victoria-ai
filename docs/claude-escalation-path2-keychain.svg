<svg viewBox="0 0 760 600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Claude escalation — Path 2 (setup-token in Keychain): the real token is injected INTO Victoria's sandbox</title>
<desc>Credential flow for the Keychain setup-token approach. The long-lived subscription OAuth token is stored in the macOS Keychain on the host, read by the deploy script, and injected into Victoria's sandbox as an environment variable — so the real token is present inside the VM and Victoria can read it.</desc>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ===== CLOUD ===== -->
<rect x="20" y="24" width="720" height="86" rx="20" fill="#6E2A1A"/>
<text x="44" y="54" fill="#F0997B" font-size="16" font-weight="600">Cloud / external</text>
<rect x="300" y="58" width="160" height="42" rx="10" fill="#3A3A37" stroke="#57574F"/><text x="380" y="79" fill="#ECEBE7" font-size="14" font-weight="600" text-anchor="middle">Anthropic API</text><text x="380" y="95" fill="#B2B0A6" font-size="11" text-anchor="middle">Claude · your subscription</text>

<!-- ===== VICTORIA SANDBOX ===== -->
<rect x="20" y="150" width="720" height="258" rx="20" fill="#0F5E48"/>
<text x="44" y="180" fill="#5DCAA5" font-size="16" font-weight="600">Victoria's sandbox — isolated microVM</text>
<rect x="40" y="196" width="215" height="46" rx="10" fill="#3A3A37" stroke="#57574F"/><text x="147" y="217" fill="#ECEBE7" font-size="14" font-weight="600" text-anchor="middle">Victoria</text><text x="147" y="234" fill="#B2B0A6" font-size="11" text-anchor="middle">local LLM · HUD · escalation</text>
<!-- token env box (highlighted amber = real credential) -->
<rect x="300" y="196" width="300" height="46" rx="10" fill="#5A4326" stroke="#D9A441" stroke-width="1.5"/><text x="450" y="216" fill="#F0C674" font-size="13" font-weight="600" text-anchor="middle">env: CLAUDE_CODE_OAUTH_TOKEN</text><text x="450" y="233" fill="#E7C58C" font-size="11" text-anchor="middle">= your REAL subscription token</text>
<rect x="300" y="262" width="300" height="46" rx="10" fill="#3A3A37" stroke="#57574F"/><text x="450" y="283" fill="#ECEBE7" font-size="14" font-weight="600" text-anchor="middle">claude -p  (subprocess)</text><text x="450" y="300" fill="#B2B0A6" font-size="11" text-anchor="middle">authenticates with that token</text>
<!-- warning callout -->
<rect x="40" y="336" width="560" height="52" rx="10" fill="#40332F" stroke="#D9A441" stroke-width="1.5"/><text x="320" y="358" fill="#F0C674" font-size="13" font-weight="600" text-anchor="middle">⚠ The real token lives inside the VM.</text><text x="320" y="376" fill="#E7C58C" font-size="11.5" text-anchor="middle">Victoria — and anything running in the sandbox — can read it. Compromise = exfiltration.</text>

<!-- ===== HOST ===== -->
<rect x="20" y="448" width="720" height="128" rx="20" fill="#123E72"/>
<text x="44" y="478" fill="#85B7EB" font-size="16" font-weight="600">Host — macOS</text>
<rect x="40" y="494" width="215" height="46" rx="10" fill="#3A3A37" stroke="#D9A441" stroke-width="1.5"/><text x="147" y="515" fill="#F0C674" font-size="13.5" font-weight="600" text-anchor="middle">macOS Keychain</text><text x="147" y="532" fill="#E7C58C" font-size="11" text-anchor="middle">token at rest (secure)</text>
<rect x="300" y="494" width="230" height="46" rx="10" fill="#3A3A37" stroke="#57574F"/><text x="415" y="515" fill="#ECEBE7" font-size="13.5" font-weight="600" text-anchor="middle">deploy-sandbox.sh</text><text x="415" y="532" fill="#B2B0A6" font-size="11" text-anchor="middle">reads Keychain → injects into kit</text>
<rect x="560" y="494" width="160" height="46" rx="10" fill="#3A3A37" stroke="#57574F"/><text x="640" y="515" fill="#ECEBE7" font-size="12.5" font-weight="600" text-anchor="middle">Docker Model Runner</text><text x="640" y="532" fill="#B2B0A6" font-size="11" text-anchor="middle">:12434 · local LLM</text>

<!-- ===== CREDENTIAL FLOW (amber) ===== -->
<!-- Keychain -> deploy (read) -->
<line x1="255" y1="517" x2="300" y2="517" stroke="#D9A441" stroke-width="2" marker-end="url(#ah)"/>
<!-- deploy -> token env (inject, crosses into VM) -->
<line x1="450" y1="494" x2="450" y2="242" stroke="#D9A441" stroke-width="2" marker-end="url(#ah)"/>
<text x="460" y="430" fill="#D9A441" font-size="12" font-weight="600">injects token</text>
<text x="460" y="446" fill="#D9A441" font-size="12" font-weight="600">INTO the VM</text>
<!-- token env -> claude -p -->
<line x1="450" y1="242" x2="450" y2="262" stroke="#D9A441" stroke-width="2" marker-end="url(#ah)"/>
<!-- claude -p -> Anthropic (authenticated call) -->
<line x1="380" y1="262" x2="380" y2="110" stroke="#D9A441" stroke-width="2" marker-end="url(#ah)"/>
<text x="388" y="132" fill="#D9A441" font-size="12">Bearer token →</text>

<!-- ===== LOCAL LLM edge (grey) ===== -->
<line x1="640" y1="494" x2="640" y2="408" stroke="#8E8E88" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="632" y="470" fill="#8E8E88" font-size="11" text-anchor="end">local LLM</text>
<line x1="147" y1="242" x2="147" y2="408" stroke="#8E8E88" stroke-width="1.6" stroke-dasharray="4 3"/>

<!-- ===== LEGEND ===== -->
<rect x="620" y="150" width="14" height="14" rx="3" fill="#5A4326" stroke="#D9A441"/><text x="640" y="161" fill="#B2B0A6" font-size="11">= real credential</text>
</svg>
