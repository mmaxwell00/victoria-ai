# Victoria — Docker Sandboxes kit (verified working end-to-end).
#
# WHY A PACKED KIT: sbx (v0.35) kits are packed artifacts (spec.yaml + optional
# files/), NOT a raw YAML.
#
# DEPLOY WITH ./deploy-sandbox.sh — it is the supported entry point. sbx mounts a
# host path at that SAME absolute path inside the sandbox (no remapping), so the
# repo/vault paths below are host-username-specific. To keep this kit portable,
# they are written as placeholders that the deploy script substitutes at pack time:
#   __VICTORIA_REPO__   -> the staged repo   (default: $HOME/sandboxes/victoria-ai)
#   __VICTORIA_VAULT__  -> the Obsidian vault (default: $HOME/Obsidian/AI/AI-Victoria)
# Do NOT `sbx kit pack sbx/` directly — you'd ship the literal placeholders. Run
# ./deploy-sandbox.sh (or replicate its substitute→pack→run→publish steps).
#
# What the deploy script does, in effect:
#   1. Stage code under an allowed mount root:  git clone <repo> $HOME/sandboxes/victoria-ai
#   2. Substitute the placeholders into a spec copy, then pack + run (agent name = kit name):
#        sbx kit pack <build> -o /tmp/victoria-kit.zip
#        sbx run --kit /tmp/victoria-kit.zip --name victoria -d victoria <repo> <vault>
#   3. Publish the HUD (IPv4 — the service is IPv4-only):
#        sbx ports victoria --publish 127.0.0.1:8001:8000
#        open http://127.0.0.1:8001        # use 127.0.0.1, NOT localhost (resolves to ::1)
#
# The vault mount needs a filesystem-allow rule for its path where sandboxes are
# org-governed (e.g. ~/Obsidian/**, case-sensitive).

schemaVersion: "1"
kind: sandbox
name: victoria
displayName: Victoria AI
description: >-
  Victoria assistant (FastAPI HUD) as a persistent Docker Sandbox service,
  backed by the host's Docker Model Runner. Installs the FULL dependency set on
  a uv-managed Python 3.11 venv (semantic memory + voice) and runs uvicorn as a
  background startup service.

agentContext: |
  Victoria's API + HUD run on port 8000 inside this sandbox. Publish to the host:
    sbx ports <sandbox> --publish 127.0.0.1:8001:8000
  The local LLM is the host's Docker Model Runner at host.docker.internal:12434.

environment:
  # NOTE — do NOT add `proxyManaged: [ANTHROPIC_API_KEY]` here. Tested 2026-08-05:
  # the sentinel it injects (`ANTHROPIC_API_KEY=proxy-managed`) is read by pydantic
  # into `settings.anthropic_api_key`, which `llm_router._pick_backend` uses as a
  # TRUTHY GATE — so every query over `complex_query_threshold` (200) words would be
  # routed to the Claude API with a bogus key and 401 instead of being answered
  # locally. sbx also reported `SBX_CRED_ANTHROPIC_MODE=none` (no injectable
  # credential), so it bought nothing. See the 2026-08-05 ADR.
  variables:
    # Pull model files straight from huggingface.co instead of HF's Xet CDN. Xet
    # hops across rotating hosts (xethub.hf.co, us.aws.cdn.hf.co, …) which is hostile
    # to a default-deny allowlist; disabling it keeps downloads on the one host we
    # allow. Slightly slower, far more predictable. (The `**.hf.co` entries above are
    # belt-and-braces in case a library ignores this.)
    HF_HUB_DISABLE_XET: "1"
    DEFAULT_LLM: docker
    # Reach the host Model Runner from inside the sandbox (NOT localhost):
    MODEL_RUNNER_URL: http://host.docker.internal:12434/engines/llama.cpp/v1
    MODEL_RUNNER_MODEL: ai/qwen2.5:32k
    # Obsidian vault mount = the knowledge base (memory + RAG). Placeholder
    # substituted by deploy-sandbox.sh (VAULT_PATH); host path == in-sandbox path.
    OBSIDIAN_VAULT_PATH: __VICTORIA_VAULT__
    ESCALATION_ENABLED: "true"
    # Claude escalation auth (subscription). Long-lived token from `claude
    # setup-token`; injected as CLAUDE_CODE_OAUTH_TOKEN for the `claude -p`
    # subprocess. NEVER committed — deploy-sandbox.sh substitutes this placeholder
    # from $CLAUDE_CODE_OAUTH_TOKEN or ~/.victoria/claude-oauth-token (empty if
    # neither exists → escalation stays off, local model answers).
    CLAUDE_CLI_OAUTH_TOKEN: "__CLAUDE_OAUTH_TOKEN__"
    # Absolute path to the CLI so escalation execs it directly, independent of the
    # uvicorn subprocess's PATH (npm's global bin is on interactive-shell PATH but
    # not the leaner service PATH). This is the shell-docker image's npm prefix/bin.
    CLAUDE_CLI_COMMAND: /usr/local/share/npm-global/bin/claude
    # Claude HOST-BRIDGE escalation (preferred; credential-containing). When set,
    # escalation POSTs the prompt to the host bridge over mTLS instead of running
    # `claude` in THIS VM — so the subscription credential never enters the sandbox
    # (see docs/claude-bridge-architecture.svg). All four are empty unless the host
    # bridge is set up: scripts/setup-bridge.sh writes ~/.victoria/bridge-env and
    # deploy-sandbox.sh substitutes these + stages the client certs under the repo
    # mount (readable in-sandbox). Empty → escalation falls back to the local CLI.
    CLAUDE_BRIDGE_URL: "__CLAUDE_BRIDGE_URL__"
    CLAUDE_BRIDGE_CLIENT_CERT: "__CLAUDE_BRIDGE_CLIENT_CERT__"
    CLAUDE_BRIDGE_CLIENT_KEY: "__CLAUDE_BRIDGE_CLIENT_KEY__"
    CLAUDE_BRIDGE_CA_CERT: "__CLAUDE_BRIDGE_CA_CERT__"

# ── Egress allowlist (Phase 3 hardening target) ──────────────────────────────
# IMPORTANT: this bites ONLY under a default-deny network baseline. Per Docker's
# governance model, an ACTIVE org policy overrides kit-defined rules — and this
# org has a blanket `NetworkAll: allow **` applied to all sandboxes, so the list
# below is currently INERT (nothing is actually restricted), by deliberate choice.
# sbx network governance is org/team-scoped (NOT per-sandbox), so activating this
# means tightening the org-wide `NetworkAll` policy in Docker Home — which affects
# every sandbox, not just Victoria. See SECURITY-AUDIT.md. Kept here as the ready,
# correct target so a future org-wide default-deny activates cleanly.
# `deniedDomains` is unnecessary: the org already enforces its own denies (DPRK, etc.).
network:
  # NOTE — `serviceDomains`/`serviceAuth` for api.anthropic.com were TESTED here on
  # 2026-08-05 and deliberately removed. The kit mechanism works (the sentinel is
  # injected as documented) but sbx reports `SBX_CRED_ANTHROPIC_MODE=none`: the
  # stored global `anthropic` secret is an OAuth *subscription* session, not an
  # injectable API key, so requests still returned 401 "invalid x-api-key".
  # Making this path work needs a real Anthropic API key (metered billing), which
  # is a deliberate no per the escalation ADRs. See the 2026-08-05 ADR.
  allowedDomains:
    # -- Local LLM: host Model Runner via the sandbox's host gateway --
    - host.docker.internal
    # -- Cloud escalation --
    - api.anthropic.com
    # -- Built-in tools --
    - duckduckgo.com              # web_search (ddgs → html./lite./links.)
    - "*.duckduckgo.com"
    - wttr.in                     # weather tool + dashboard weather box
    # -- Dashboard feeds --
    - query1.finance.yahoo.com    # markets: stocks / metals / indices
    - query2.finance.yahoo.com
    - feeds.nbcnews.com           # headlines: NBC News RSS
    - moxie.foxnews.com           # headlines: Fox News RSS
    # -- Skill import + GitHub tools --
    - github.com
    - api.github.com
    - codeload.github.com
    - raw.githubusercontent.com
    - objects.githubusercontent.com
    # GitHub serves release assets from release-assets.githubusercontent.com (and
    # rotates these hostnames), which `uv venv --python 3.11` needs to fetch its
    # managed CPython. Missing it = 403 → no venv → no ChromaDB/voice → sandbox
    # creation aborts (measured 2026-08-05). The wildcard future-proofs the rotation.
    - "*.githubusercontent.com"
    - release-assets.githubusercontent.com
    # -- Build-time: dependency install (uv-managed py3.11 + pip + model pulls) --
    - pypi.org
    - files.pythonhosted.org
    - huggingface.co
    - "*.huggingface.co"
    # Hugging Face serves model BLOBS through Xet storage on a DIFFERENT domain
    # (cas-server.xethub.hf.co). Without these, huggingface.co resolves metadata but
    # the download 403s — measured 2026-08-05: /v1/transcribe returned "CAS Client
    # Error … 403" because faster-whisper couldn't fetch the Whisper model.
    # NOTE the DOUBLE star: sbx wildcards are `*` = ONE label, `**` = many. `*.hf.co`
    # covers xethub.hf.co but NOT us.aws.cdn.hf.co (three labels), which is where the
    # blob download actually landed — measured 2026-08-05, two 403s on two different
    # HF hosts before this was understood.
    - hf.co
    - "**.hf.co"
    - "**.huggingface.co"
    - deb.debian.org
    # The shell-docker base image moved to UBUNTU, so apt fetches from the Ubuntu
    # mirrors — on arm64 that's ports.ubuntu.com, NOT deb.debian.org. Missing these
    # under default-deny egress made `apt-get` exit 100 ("repository … is not
    # signed" is what a proxy denial looks like to apt) and aborted sandbox
    # creation outright (2026-08-05). Both :80 (apt uses plain HTTP) and the bare
    # host are listed so the entry can't be defeated by port matching.
    - ports.ubuntu.com
    - "ports.ubuntu.com:80"
    - archive.ubuntu.com
    - "archive.ubuntu.com:80"
    - security.ubuntu.com
    - "security.ubuntu.com:80"
    # The base image ships a Docker CE apt repo, so `apt-get update` also hits
    # download.docker.com. Blocking it makes the whole update exit non-zero, which
    # (with the `&&`) silently skips the ffmpeg/PortAudio install — that's why voice
    # deps were missing after the 2026-08-05 rebuild even though the Ubuntu mirrors
    # were reachable.
    - download.docker.com
    - "download.docker.com:80"              # apt: ffmpeg + libportaudio2
    - registry.npmjs.org          # optional MCP (node) servers

commands:
  install:
    # System libs: ffmpeg (Whisper STT) + PortAudio (sounddevice). Root user.
    # NON-FATAL on purpose (`|| echo`): a start-hook failure here aborts the whole
    # sandbox creation, so a transient apt/egress problem would cost the entire
    # deployment rather than just voice. Measured 2026-08-05: apt exited 100
    # ("repository … is not signed" — the proxy denying ports.ubuntu.com), which
    # killed `sbx run` and left NO sandbox at all. Voice degrades; Victoria still runs.
    - command: >-
        apt-get update -qq && apt-get install -y -qq ffmpeg libportaudio2
        || echo "[install] apt failed — voice deps unavailable (ffmpeg/PortAudio); Victoria still starts"
      user: "0"
      description: System libraries for voice (Whisper ffmpeg + PortAudio) — non-fatal
    # The shell-docker image ships Python 3.14 — too new for chromadb / faster-
    # whisper / piper. uv (preinstalled in the image) manages a Python 3.11 venv
    # so the FULL dependency set installs → semantic memory (ChromaDB) + voice.
    # The app's own deps install FIRST so uvicorn is ready fast (the startup gate
    # waits on `import uvicorn`); the optional CLI below must not delay/starve them.
    - command: uv venv /home/agent/venv --python 3.11
      user: "1000"
      description: Create a uv-managed Python 3.11 virtualenv (as the agent user)
    - command: uv pip install --python /home/agent/venv/bin/python -r __VICTORIA_REPO__/requirements.txt
      user: "1000"
      description: Install the full Victoria dependency set as the agent (ChromaDB + voice + all)
    # Claude Code CLI — the "Claude" backend / escalation shells out to `claude`
    # (subscription auth). Installed LAST + non-fatal so a slow/large download never
    # delays or starves the venv install above; node ships in the image and puts it
    # on PATH for the uvicorn subprocess. Auth is CLAUDE_CLI_OAUTH_TOKEN above;
    # without it, escalation degrades gracefully (local model answers).
    - command: npm install -g @anthropic-ai/claude-code || echo "[install] claude CLI install failed — escalation unavailable, local model still answers"
      user: "0"
      description: Claude Code CLI for the Claude escalation backend (subscription auth; last + non-fatal)
  startup:
    # A long-running service goes in startup/background (NOT entrypoint, which is
    # the interactive agent process and dies on detach). Bind 0.0.0.0; run from
    # the Python 3.11 venv so semantic memory + voice are available.
    #
    # RACE GUARD: startup can fire before `install` has finished. Two distinct
    # traps, both fatal to uvicorn:
    #   1. `uv venv` hasn't run yet → /home/agent/venv/bin/python is a dangling
    #      symlink → "python: not found".
    #   2. The interpreter is runnable (uv venv done) but `uv pip install` is still
    #      running → "No module named uvicorn" (and chromadb/etc. absent).
    # So we gate on the real precondition for `uvicorn victoria.main:app`: the app
    # itself importing (which requires the full dependency set). Bounded to ~20 min
    # — a cold rebuild re-downloads the full wheel set (torch, faster-whisper,
    # chromadb, …) with no cache, which can run well past 8 min on a slow/loaded
    # host/network. The loop breaks the instant the import succeeds, so the high
    # ceiling only ever costs time on a genuinely-slow install.
    - command:
        - sh
        - -c
        - |
          exec > /tmp/victoria.log 2>&1
          VENV=/home/agent/venv/bin/python
          STAGE=__VICTORIA_REPO__
          cd "$STAGE"
          for i in $(seq 1 600); do
            "$VENV" -c 'import uvicorn, victoria.main' >/dev/null 2>&1 && break
            echo "[startup] waiting for dependencies + app to import ($i/600)…"
            sleep 2
          done
          if ! "$VENV" -c 'import uvicorn, victoria.main' >/dev/null 2>&1; then
            echo "[startup] FATAL: app never became importable — last error:"
            "$VENV" -c 'import uvicorn, victoria.main'
            exit 1
          fi
          echo "[startup] dependencies ready; launching uvicorn (supervised)"
          # Put the npm global bin on PATH so the Claude Code CLI (`claude`) is
          # found by the escalation subprocess. It installs under npm's global
          # prefix (…/npm-global/bin), which is on interactive-shell PATH via a
          # profile script but NOT on this startup subprocess's leaner PATH.
          NPM_BIN="$(npm prefix -g 2>/dev/null)/bin"
          [ -d "$NPM_BIN" ] && export PATH="$NPM_BIN:$PATH" && echo "[startup] PATH += $NPM_BIN"
          # SUPERVISOR: keep uvicorn up. If it exits — a crash, or the sandbox's
          # transient exec-cycling knocking the service over while the container
          # stays "running" — restart it (that failure mode leaves the port
          # published but the backend dead → ERR_CONNECTION_RESET). NOT `exec`, so
          # the loop survives to relaunch; short backoff avoids a tight crash loop.
          # The app-import gate above already ran, so restarts are fast.
          while true; do
            "$VENV" -m uvicorn victoria.main:app --host 0.0.0.0 --port 8000
            echo "[startup] uvicorn exited (code $?) — restarting in 3s"
            sleep 3
          done
      background: true
      description: Start the Victoria API server on :8000 (supervised — self-heals if uvicorn exits)

sandbox:
  image: docker/sandbox-templates:shell-docker
  aiFilename: CLAUDE.md
  entrypoint:
    run: [bash]
